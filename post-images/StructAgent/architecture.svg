<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-label="StructAgent task loop: task to planner to orchestrator to tool tree to draw.io, with scene graph and vision critic feedback">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
    <style>
      .bx  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:8; }
      .llm { fill:#e8f1fa; stroke:#2e6fb5; stroke-width:1.5; }
      .st  { fill:#f3f0fc; stroke:#7c5bd9; stroke-width:1.5; }
      .app { fill:#fff4e5; stroke:#e0902f; stroke-width:1.5; }
      .t   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2933; }
      .ttl { font-size:15px; font-weight:600; }
      .sub { font-size:11.5px; fill:#6b7480; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .lbl { font-size:11.5px; fill:#6b7480; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .ln  { stroke:#64748b; stroke-width:1.6; fill:none; marker-end:url(#ah); }
      .dsh { stroke:#a855a8; stroke-width:1.5; fill:none; stroke-dasharray:5 4; marker-end:url(#ah); }
    </style>
  </defs>

  <rect x="60"  y="36"  width="200" height="54" class="bx"/>
  <text x="160" y="58"  class="t ttl" text-anchor="middle">Task</text>
  <text x="160" y="76"  class="sub"   text-anchor="middle">plain English</text>

  <rect x="60"  y="140" width="200" height="54" class="bx llm"/>
  <text x="160" y="162" class="t ttl" text-anchor="middle">Planner</text>
  <text x="160" y="180" class="sub"   text-anchor="middle">one LLM call</text>

  <rect x="600" y="140" width="200" height="54" class="bx st"/>
  <text x="700" y="162" class="t ttl" text-anchor="middle">Scene Graph</text>
  <text x="700" y="180" class="sub"   text-anchor="middle">obj_001, edge_001</text>

  <rect x="60"  y="250" width="200" height="54" class="bx"/>
  <text x="160" y="272" class="t ttl" text-anchor="middle">Orchestrator</text>
  <text x="160" y="290" class="sub"   text-anchor="middle">no inference</text>

  <rect x="330" y="250" width="200" height="54" class="bx"/>
  <text x="430" y="272" class="t ttl" text-anchor="middle">Tool tree</text>
  <text x="430" y="290" class="sub"   text-anchor="middle">L2 → L1 → L0</text>

  <rect x="600" y="250" width="200" height="54" class="bx app"/>
  <text x="700" y="272" class="t ttl" text-anchor="middle">draw.io</text>
  <text x="700" y="290" class="sub"   text-anchor="middle">closed UI, no API</text>

  <rect x="60"  y="372" width="200" height="54" class="bx llm"/>
  <text x="160" y="394" class="t ttl" text-anchor="middle">Vision critic</text>
  <text x="160" y="412" class="sub"   text-anchor="middle">pass / fail</text>

  <path class="ln" d="M160 90 L160 134"/>
  <path class="ln" d="M160 194 L160 244"/>
  <text x="172" y="223" class="lbl">plan · ordered tool calls</text>

  <path class="ln" d="M600 167 L266 167"/>
  <text x="433" y="158" class="lbl" text-anchor="middle">what is on the canvas, by id</text>

  <path class="ln" d="M260 277 L324 277"/>
  <path class="ln" d="M530 277 L594 277"/>
  <text x="562" y="268" class="lbl" text-anchor="middle">clicks</text>

  <path class="ln" d="M700 244 L700 200"/>
  <text x="712" y="226" class="lbl">reconcile</text>

  <path class="ln" d="M160 304 L160 366"/>
  <text x="172" y="340" class="lbl">screenshot at a checkpoint</text>

  <path class="dsh" d="M60 399 L25 399 L25 167 L54 167"/>
  <text transform="translate(17,290) rotate(-90)" class="lbl" text-anchor="middle" fill="#a855a8">on fail · re-plan from here</text>
</svg>
