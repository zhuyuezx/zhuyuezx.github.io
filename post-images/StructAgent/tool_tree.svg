<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="Three-layer tool tree: place_and_label at L2 expands into four L1 operands, which bottom out in three L0 pyautogui atoms">
  <defs>
    <style>
      .bx  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:7; }
      .l2  { fill:#e8f1fa; stroke:#2e6fb5; stroke-width:1.5; }
      .l1  { fill:#f3f0fc; stroke:#7c5bd9; stroke-width:1.5; }
      .l0  { fill:#e6f5f3; stroke:#1f9d8f; stroke-width:1.5; }
      .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#1f2933; }
      .sans{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .tag { font-size:15px; font-weight:700; fill:#1f2933; }
      .note{ font-size:11.5px; fill:#6b7480; }
      .ln  { stroke:#9aa5b1; stroke-width:1.4; fill:none; }
      .num { font-size:11px; font-weight:700; fill:#2e6fb5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <text x="10" y="58"  class="sans tag">L2</text>
  <text x="10" y="76"  class="sans note">JSON only</text>
  <text x="10" y="198" class="sans tag">L1</text>
  <text x="10" y="216" class="sans note">semantic</text>
  <text x="10" y="338" class="sans tag">L0</text>
  <text x="10" y="356" class="sans note">pyautogui</text>

  <path class="ln" d="M485 94 L210 174"/>
  <path class="ln" d="M485 94 L393 174"/>
  <path class="ln" d="M485 94 L576 174"/>
  <path class="ln" d="M485 94 L759 174"/>

  <path class="ln" d="M210 228 L470 314"/>
  <path class="ln" d="M393 228 L245 314"/>
  <path class="ln" d="M576 228 L727 314"/>
  <path class="ln" d="M759 228 L510 314"/>

  <rect x="365" y="40" width="240" height="54" class="bx l2"/>
  <text x="485" y="64" class="mono" font-size="14" text-anchor="middle">place_and_label</text>
  <text x="485" y="82" class="sans note" text-anchor="middle">one file, no Python</text>

  <rect x="130" y="174" width="160" height="54" class="bx l1"/>
  <text x="210" y="206" class="mono" font-size="12.5" text-anchor="middle">place_shape</text>
  <rect x="313" y="174" width="160" height="54" class="bx l1"/>
  <text x="393" y="206" class="mono" font-size="12.5" text-anchor="middle">type_label</text>
  <rect x="496" y="174" width="160" height="54" class="bx l1"/>
  <text x="576" y="206" class="mono" font-size="12.5" text-anchor="middle">press_escape</text>
  <rect x="679" y="174" width="160" height="54" class="bx l1"/>
  <text x="759" y="199" class="mono" font-size="12.5" text-anchor="middle">click_empty</text>
  <text x="759" y="215" class="mono" font-size="12.5" text-anchor="middle">_canvas</text>

  <circle cx="210" cy="158" r="10" fill="#ffffff" stroke="#2e6fb5" stroke-width="1.3"/>
  <text x="210" y="162" class="num" text-anchor="middle">1</text>
  <circle cx="393" cy="158" r="10" fill="#ffffff" stroke="#2e6fb5" stroke-width="1.3"/>
  <text x="393" y="162" class="num" text-anchor="middle">2</text>
  <circle cx="576" cy="158" r="10" fill="#ffffff" stroke="#2e6fb5" stroke-width="1.3"/>
  <text x="576" y="162" class="num" text-anchor="middle">3</text>
  <circle cx="759" cy="158" r="10" fill="#ffffff" stroke="#2e6fb5" stroke-width="1.3"/>
  <text x="759" y="162" class="num" text-anchor="middle">4</text>

  <rect x="130" y="314" width="200" height="54" class="bx l0"/>
  <text x="230" y="346" class="mono" font-size="12.5" text-anchor="middle">keyboard_type(text)</text>
  <rect x="385" y="314" width="200" height="54" class="bx l0"/>
  <text x="485" y="346" class="mono" font-size="12.5" text-anchor="middle">mouse_click(x, y)</text>
  <rect x="640" y="314" width="200" height="54" class="bx l0"/>
  <text x="740" y="346" class="mono" font-size="12.5" text-anchor="middle">key_press(key)</text>

  <text x="130" y="404" class="sans note">L0 is the only layer registered in Python. Everything above it is a JSON file, so a successful run can be saved back as a new tool.</text>
</svg>
